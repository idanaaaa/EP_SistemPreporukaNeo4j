<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(naslov)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${naslov} + ' | EP Shop'">EP Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar(aktivno)" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">EP Shop</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/proizvodi}"
                   th:classappend="${aktivno == 'proizvodi'} ? 'active'">Proizvodi</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/kategorije}"
                   th:classappend="${aktivno == 'kategorije'} ? 'active'">Kategorije</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/narudzbe}"
                   th:classappend="${aktivno == 'narudzbe'} ? 'active'">Narudžbe</a>
            </li>
        </ul>
        <ul class="navbar-nav align-items-center">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/korpa}" th:classappend="${aktivno == 'korpa'} ? 'active'">
                    Korpa
                    <span th:if="${@korpa.brojKomada > 0}" class="badge text-bg-light"
                          th:text="${@korpa.brojKomada}">0</span>
                </a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/prijava}">Prijava</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/registracija}">Registracija</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="navbar-text mx-2" sec:authentication="principal.ime">Ime</span>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/odjava}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-light">Odjava</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div th:fragment="poruke">
    <div th:if="${poruka}" class="alert alert-success" th:text="${poruka}">Poruka</div>
    <div th:if="${greska}" class="alert alert-danger" th:text="${greska}">Greška</div>
</div>

</body>
</html>
