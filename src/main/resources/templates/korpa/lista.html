<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Korpa')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('korpa')}"></nav>

<main class="container">
    <h1 class="mb-4">Korpa</h1>
    <div th:replace="~{fragments/layout :: poruke}"></div>

    <p th:if="${#lists.isEmpty(stavke)}" class="text-muted">
        Korpa je prazna. <a th:href="@{/proizvodi}">Pogledajte proizvode.</a>
    </p>

    <th:block th:unless="${#lists.isEmpty(stavke)}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Proizvod</th>
                <th class="text-end">Cijena</th>
                <th style="width: 200px">Količina</th>
                <th class="text-end">Iznos</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${stavke}">
                <td><a th:href="@{/proizvodi/{id}(id=${s.proizvod.id})}" th:text="${s.proizvod.naziv}">Naziv</a></td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(s.proizvod.cijena, 1, 'POINT', 2, 'COMMA')} + ' KM'">0,00 KM</td>
                <td>
                    <form th:action="@{/korpa/{id}/kolicina(id=${s.proizvod.id})}" method="post" class="input-group">
                        <input type="number" name="kolicina" class="form-control" min="1"
                               th:max="${s.proizvod.naStanju}" th:value="${s.kolicina}" aria-label="Količina">
                        <button type="submit" class="btn btn-outline-secondary">Promijeni</button>
                    </form>
                </td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(s.iznos, 1, 'POINT', 2, 'COMMA')} + ' KM'">0,00 KM</td>
                <td class="text-end">
                    <form th:action="@{/korpa/{id}/ukloni(id=${s.proizvod.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Ukloni</button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="text-end">Ukupno</th>
                <th class="text-end"
                    th:text="${#numbers.formatDecimal(ukupno, 1, 'POINT', 2, 'COMMA')} + ' KM'">0,00 KM</th>
                <th></th>
            </tr>
            </tfoot>
        </table>

        <a th:href="@{/korpa/potvrda}" class="btn btn-primary">Nastavi na potvrdu</a>
        <a th:href="@{/proizvodi}" class="btn btn-link">Nastavi kupovinu</a>
    </th:block>
</main>
</body>
</html>
