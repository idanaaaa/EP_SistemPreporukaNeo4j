<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Narudžbe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('narudzbe')}"></nav>

<main class="container">
    <h1 class="mb-4">Narudžbe</h1>
    <div th:replace="~{fragments/layout :: poruke}"></div>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Broj</th>
            <th>Datum</th>
            <th sec:authorize="hasRole('ADMIN')">Kupac</th>
            <th>Status</th>
            <th class="text-end">Ukupno</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="n : ${narudzbe}">
            <td><a th:href="@{/narudzbe/{id}(id=${n.id})}" th:text="'#' + ${n.id}">#1</a></td>
            <td th:text="${#temporals.format(n.kreirano, 'dd.MM.yyyy. HH:mm')}">01.01.2026. 12:00</td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${n.kupacIme}">Kupac</td>
            <td><span class="badge text-bg-secondary" th:text="${n.status}">NOVA</span></td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(n.ukupno, 1, 'POINT', 2, 'COMMA')} + ' KM'">0,00 KM</td>
        </tr>
        <tr th:if="${#lists.isEmpty(narudzbe)}">
            <td colspan="5" class="text-muted">Još nema narudžbi.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
