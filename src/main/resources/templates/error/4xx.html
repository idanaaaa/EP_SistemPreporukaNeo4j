<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Greška')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('greska')}"></nav>

<main class="container" style="max-width: 720px">
    <h1 class="mb-3" th:text="${status == 403} ? 'Nemate pristup ovoj stranici' : 'Stranica nije dostupna'">Greška</h1>
    <p class="text-muted" th:if="${status != 403}" th:text="${message}">Poruka</p>
    <a th:href="@{/}" class="btn btn-primary">Početna</a>
</main>
</body>
</html>
